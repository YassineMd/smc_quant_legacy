plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smc.domtape'
    compileSdk 33

    defaultConfig {
        applicationId "com.smc.domtape"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "0.1"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
