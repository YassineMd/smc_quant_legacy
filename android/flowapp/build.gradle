plugins {
    id 'com.android.application'
}

// VM fallback endpoint + auth token live in local.properties (gitignored — never in the repo)
def lp = new Properties()
def lpFile = rootProject.file('local.properties')
if (lpFile.exists()) lpFile.withInputStream { lp.load(it) }

android {
    namespace 'com.smc.flowtab'
    compileSdk 33

    defaultConfig {
        applicationId "com.smc.flowtab"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "0.1"
        buildConfigField "String", "VM_HOST", "\"${lp.getProperty('flow.vmhost', '')}\""
        buildConfigField "String", "FLOW_TOKEN", "\"${lp.getProperty('flow.token', '')}\""
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
